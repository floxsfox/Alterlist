name: Build Alterlist APK (dari Alterlist.zip)

# Hasil build: SATU APK rilis yang dipublikasikan ke halaman Releases repo (bukan artifact zip).
# Nama rilis diambil dari versionName di app/build.gradle.kts (mis. v3.4.0).
# Di repo cukup ada 2 file: Alterlist.zip (root repo) dan file workflow ini.

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dan rilis APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Opsional: keystore rilis sendiri lewat GitHub Secrets.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ekstrak Alterlist.zip
        run: |
          test -f Alterlist.zip || { echo "::error::Alterlist.zip tidak ditemukan di root repo"; exit 1; }
          unzip -q -o Alterlist.zip
          test -f Alterlist/gradlew || { echo "::error::Isi zip tidak sesuai (Alterlist/gradlew tidak ada)"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: Alterlist

      - name: Siapkan Android SDK (lisensi + platform 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          PKG=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[0-9.]*' | sort -u | head -n 1 || true)
          if [ -n "$PKG" ]; then yes | "$SDKM" "$PKG" > /dev/null || true; fi

      - name: Siapkan keystore rilis (opsional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Beri izin eksekusi gradlew
        working-directory: Alterlist
        run: chmod +x gradlew

      - name: Build APK rilis
        working-directory: Alterlist
        run: ./gradlew --console=plain assembleRelease

      - name: Siapkan satu APK
        id: apk
        working-directory: Alterlist
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Alterlist-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Publikasikan ke Releases
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: Alterlist
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          FILE="dist/Alterlist-${{ steps.apk.outputs.version }}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Alterlist ${{ steps.apk.outputs.version }}" --notes "Alterlist ${{ steps.apk.outputs.version }}" --latest
          fi
